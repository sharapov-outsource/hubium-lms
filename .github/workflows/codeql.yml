name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 3 * * 1'

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  # Code scanning on a private personal repository needs GitHub Advanced Security, so the
  # analysis runs once the repository is public. Schedule events carry no repository
  # data, hence the API lookup instead of github.event.repository.private.
  visibility:
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.repo.outputs.public }}
    steps:
      - id: repo
        env: { GH_TOKEN: '${{ github.token }}' }
        run: echo "public=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private | not')" >> "$GITHUB_OUTPUT"

  analyze:
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
