name: CI

on:
  push:
    branches: [main]
  pull_request:
  # the release workflow runs every check before it publishes
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://hubium:hubium@localhost:5432/hubium
  APP_URL: http://localhost:3000
  CONTENT_HOST: http://127.0.0.1:3000
  APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-0000
  SMTP_URL: smtp://localhost:1025
  NEXT_TELEMETRY_DISABLED: 1
  # e2e signs in hundreds of times from one IP
  AUTH_RATE_LIMIT: 'off'

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env: { POSTGRES_USER: hubium, POSTGRES_PASSWORD: hubium, POSTGRES_DB: hubium }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hubium" --health-interval 5s --health-retries 20
      s3:
        image: rustfs/rustfs:1.0.1
        env: { RUSTFS_ACCESS_KEY: hubium, RUSTFS_SECRET_KEY: hubium-secret }
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      # pnpm version from package.json "packageManager"; runs pnpm install --frozen-lockfile
      - uses: pnpm/setup@v3
        with: { runtime: node@24, cache: true, require-lockfile: true }
      # the directory of the LDAP tests (e2e/ldap)
      - name: Start OpenLDAP
        run: |
          docker run -d --name openldap -p 1389:389 \
            -e LDAP_ORGANISATION=Hubium -e LDAP_DOMAIN=hubium.test -e LDAP_ADMIN_PASSWORD=ldap-admin \
            -v "$PWD/e2e/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom" \
            osixia/openldap:1.5.0 --copy-service
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm lint
      - name: Shell scripts
        run: shellcheck install-hubium.sh deploy/bin/hubium scripts/bundle.sh
      - run: pnpm depcruise
      - run: pnpm licenses:check
      - run: pnpm --filter @hubium/db migrate:deploy
      - name: Schema drift
        run: pnpm --filter @hubium/db migrate:diff
      - run: pnpm typecheck
      - run: pnpm test
        env:
          S3_TEST_ENDPOINT: http://localhost:9000
          S3_TEST_ACCESS_KEY: hubium
          S3_TEST_SECRET_KEY: hubium-secret
          LDAP_TEST_URL: ldap://127.0.0.1:1389
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    env:
      # the webhook scenario runs its receiver on the runner's loopback, and the sign-in
      # scenarios use the Keycloak started below
      SSRF_ALLOW_HOSTS: 127.0.0.1
      AUTH_KEYCLOAK_ID: hubium-oauth
      AUTH_KEYCLOAK_SECRET: hubium-oauth-secret
      AUTH_KEYCLOAK_ISSUER: http://127.0.0.1:8080/realms/hubium
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env: { POSTGRES_USER: hubium, POSTGRES_PASSWORD: hubium, POSTGRES_DB: hubium }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hubium" --health-interval 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with: { runtime: node@24, cache: true, require-lockfile: true }
      # the directory of the LDAP tests (e2e/ldap)
      - name: Start OpenLDAP
        run: |
          docker run -d --name openldap -p 1389:389 \
            -e LDAP_ORGANISATION=Hubium -e LDAP_DOMAIN=hubium.test -e LDAP_ADMIN_PASSWORD=ldap-admin \
            -v "$PWD/e2e/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom" \
            osixia/openldap:1.5.0 --copy-service
      # the identity provider of the single sign-on scenarios; boots while the app builds
      - name: Start Keycloak
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/e2e/keycloak:/opt/keycloak/data/import:ro" \
            keycloak/keycloak:26.4.2 start-dev --import-realm
      - run: pnpm --filter @hubium/db migrate:deploy
      - run: pnpm db:seed --profile demo
      - run: pnpm --filter @hubium/web build && pnpm --filter @hubium/worker build
      - run: pnpm --filter @hubium/e2e exec playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Start app
        run: |
          (cd apps/web && pnpm start &)
          (cd apps/worker && WORKER_QUEUES=default,media pnpm start &)
          pnpm dlx wait-on -t 120000 http://localhost:3000/api/health http://localhost:3001/healthz \
            http://127.0.0.1:8080/realms/hubium/.well-known/openid-configuration
      - run: pnpm --filter @hubium/e2e e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results

  # Builds the production images, installs them with install-hubium.sh (Docker mode: every
  # optional service including ClamAV, S3 storage, Caddy on *.localhost) and runs the checks
  # in e2e/stack.
  docker:
    runs-on: ubuntu-latest
    needs: check
    env:
      BUILD_COMMIT: ${{ github.sha }}
      # images ghcr.io/sharapov-outsource/hubium-lms{,-media}:ci, built here
      HUBIUM_VERSION: ci
      COMPOSE_PROFILES: media
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose -f docker/compose.yml build
      - name: Image sizes
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep hubium
      - name: Install with install-hubium.sh
        run: |
          mkdir -p release && cp docker/compose.yml docker/Caddyfile release/
          sudo bash install-hubium.sh --yes --mode docker --from-dir release --version ci --no-pull \
            --domain lms.localhost --content-domain content.localhost --https caddy --db bundled \
            --storage s3 --files-domain files.localhost --modules all --demo yes --antivirus yes \
            --admin-email admin@hubium.local --admin-password 'Admin12345!'
      - uses: pnpm/setup@v3
        with: { runtime: node@24, cache: true, require-lockfile: true }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Google Chrome from the runner image (it plays H.264), not Playwright's Chromium
      - run: pnpm --filter @hubium/e2e stack
        env: { STACK_ANTIVIRUS: '1' }
      - name: Upgrade in place
        run: sudo bash install-hubium.sh upgrade --yes --from-dir release --version ci --no-pull --backup yes
      - name: Stack logs
        if: failure()
        run: |
          sudo docker compose --project-directory /opt/hubium logs --no-color 2>&1 | tee stack.log > /dev/null || true
          sudo cp /var/log/hubium-install.log . && sudo chmod a+r hubium-install.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: stack-report
          path: |
            stack.log
            hubium-install.log
            e2e/test-results

  # Builds the release archive, installs it with install-hubium.sh as systemd services
  # (PostgreSQL 18 from PGDG, local file storage, Caddy, ffmpeg), runs e2e/stack against it,
  # checks the oldest supported PostgreSQL and upgrades in place.
  native:
    runs-on: ubuntu-24.04
    needs: check
    services:
      pg16:
        image: pgvector/pgvector:0.8.7-pg16-trixie
        env: { POSTGRES_USER: hubium, POSTGRES_PASSWORD: hubium, POSTGRES_DB: hubium }
        ports: ["5499:5432"]
        options: >-
          --health-cmd "pg_isready -U hubium" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the release archive
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: bundle
          build-args: BUILD_COMMIT=${{ github.sha }}
          outputs: type=local,dest=release
          cache-from: type=gha,scope=bundle-amd64
          cache-to: type=gha,scope=bundle-amd64,mode=max
      - name: Checksums, as a release has them
        run: (cd release && sha256sum -- *.tar.gz > SHA256SUMS && ls -la)
      - name: Install with install-hubium.sh
        run: |
          sudo bash install-hubium.sh --yes --mode native --from-dir release \
            --domain lms.localhost --content-domain content.localhost --https caddy --db bundled \
            --storage fs --modules all --demo yes \
            --admin-email admin@hubium.local --admin-password 'Admin12345!'
      # doctor reports the missing SMTP server; the database must be Hubium's, up to date
      - run: (cd / && sudo -u hubium hubium doctor --json || true) | jq -e '.state == "hubium" and (.pending | length == 0)'
      - uses: pnpm/setup@v3
        with: { runtime: node@24, cache: true, require-lockfile: true }
      - run: pnpm --filter @hubium/e2e stack
      - name: PostgreSQL 16, the oldest supported
        working-directory: /
        run: |
          export DATABASE_URL=postgresql://hubium:hubium@127.0.0.1:5499/hubium
          sudo -u hubium --preserve-env=DATABASE_URL hubium doctor db
          sudo -u hubium --preserve-env=DATABASE_URL SEED_ADMIN_PASSWORD=Admin12345! hubium migrate --seed minimal
          sudo -u hubium --preserve-env=DATABASE_URL hubium doctor db
      - name: Upgrade in place
        run: sudo bash install-hubium.sh upgrade --yes --from-dir release --backup yes
      - name: Logs
        if: failure()
        run: |
          sudo journalctl -u 'hubium-*' -u caddy -u postgresql@18-main --no-pager | tee services.log > /dev/null || true
          sudo cp /var/log/hubium-install.log . && sudo chmod a+r hubium-install.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: native-report
          path: |
            services.log
            hubium-install.log
            e2e/test-results
