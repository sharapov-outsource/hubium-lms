name: Предложение · Feature request
description: Новая возможность или улучшение
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Задача · Problem
      description: Какую задачу вы решаете и почему сейчас это неудобно или невозможно.
      placeholder: Как преподаватель, я хочу …, чтобы …
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение · Proposed solution
      description: Как это могло бы работать. Если в Moodle есть похожая функция, укажите её.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы · Alternatives
      description: Какие обходные пути или другие варианты вы рассматривали.

  - type: dropdown
    id: role
    attributes:
      label: Для кого · Who benefits
      multiple: true
      options:
        - Студенты
        - Преподаватели
        - Администраторы
        - Разработчики и интеграторы
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Раздел · Area
      options:
        - Вход и учётные записи
        - Курсы, разделы, запись на курс
        - Элементы курса
        - Журнал оценок
        - Коммуникации и календарь
        - AI
        - Импорт и экспорт
        - REST API и интеграции
        - Администрирование и эксплуатация
        - Мобильная версия и PWA
        - Другое
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Дополнительно · Additional context
      description: Макеты, скриншоты, ссылки.

  - type: checkboxes
    id: checks
    attributes:
      label: Проверка · Checks
      options:
        - label: Среди существующих issue такого предложения нет
          required: true
