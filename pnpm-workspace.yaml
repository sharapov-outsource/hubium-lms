packages:
  - apps/*
  - packages/*
  - modules/*
  - e2e
  - tools/depcruise
  - tools/licenses

# Dependencies allowed to run install scripts; everything else is blocked (strictDepBuilds).
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  # next-intl's optional extractor; prebuilt binaries come from optional dependencies
  "@parcel/watcher": false
  "@swc/core": false

# dependency-cruiser loads whichever TypeScript it can resolve; declaring it as a peer lets
# tools/depcruise hand it TypeScript 6 while the rest of the workspace uses TypeScript 7.
packageExtensions:
  dependency-cruiser:
    peerDependencies:
      typescript: ">=2.0.0 <7.0.0"
    peerDependenciesMeta:
      typescript:
        optional: true

# Transitive security fixes (mysql2 comes with better-auth's optional adapters; unused here)
overrides:
  mysql2: ">=3.23.1"

# pnpm skips releases younger than a day (minimumReleaseAge). These exact versions were
# taken on purpose while still that fresh; entries can go once they are older than a day.
minimumReleaseAgeExclude:
  - "@aws-sdk/checksums@3.1001.3"
  - "@aws-sdk/client-s3@3.1150.0"
  - "@aws-sdk/core@3.978.3"
