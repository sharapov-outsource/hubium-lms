# Hubium LMS behind nginx, for an installation without the bundled Caddy
# (install-hubium.sh --https none writes this file with its names and port). By hand: replace
# lms.example.org, content.example.org and 127.0.0.1:3000 (HUBIUM_WEB_BIND, or PORT of a
# native installation). nginx 1.18 or newer.
#
# One certificate for both names, at the paths certbot keeps it. With its nginx plugin
# (apt install certbot python3-certbot-nginx), take it once nginx runs, then add this site:
#   certbot certonly --nginx -d lms.example.org -d content.example.org \
#     --deploy-hook "systemctl reload nginx"
#   cp nginx.conf /etc/nginx/conf.d/hubium.conf && nginx -t && systemctl reload nginx
# certbot renews it by itself. Any other certificate works too: change the two paths.
#
# The app expects one proxy in front of it (TRUSTED_PROXY_HOPS=1, the default): set 2 when a
# CDN or a balancer stands before nginx. Files on S3 are downloaded from the S3 service itself
# (S3_PUBLIC_URL); the S3 storage the installer runs in Docker is reached through Caddy only.

# The access log without tokens: those of content links, unsubscribe and calendar feed paths
# and ?token= in sign-in mails are replaced, and the Referer, which may carry them, is not
# written. nginx's error log names a failed request as it came: keep it to administrators.
map $request_uri $hubium_uri_path {
    "~^(?<hubium_p1>.*?/(?:c|unsubscribe|ical)/)[^/?]+(?<hubium_p2>.*)$" "${hubium_p1}[redacted]${hubium_p2}";
    default $request_uri;
}
map $hubium_uri_path $hubium_uri {
    "~^(?<hubium_q1>.*?[?&]token=)[^&]*(?<hubium_q2>.*)$" "${hubium_q1}[redacted]${hubium_q2}";
    default $hubium_uri_path;
}
log_format hubium escape=json '{"time":"$time_iso8601","remote_ip":"$remote_addr",'
    '"host":"$host","method":"$request_method","uri":"$hubium_uri","proto":"$server_protocol",'
    '"status":$status,"size":$body_bytes_sent,"duration":$request_time,'
    '"user_agent":"$http_user_agent"}';

upstream hubium_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name lms.example.org content.example.org;
    access_log /var/log/nginx/hubium.access.log hubium;
    # in a location: certbot answers its challenges here with locations of its own
    location / {
        return 301 https://$host$request_uri;
    }
}

# The LMS, and untrusted content (SCORM, H5P) on its own origin: the app answers only /c/*
# there. Both go to the app as they came.
server {
    # nginx 1.25.1 and newer warn about "http2" here and take "http2 on;" instead
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lms.example.org content.example.org;
    access_log /var/log/nginx/hubium.access.log hubium;

    ssl_certificate /etc/letsencrypt/live/lms.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hubium:10m;

    # the app checks the size of uploads itself, and takes large files in parts
    client_max_body_size 0;

    location / {
        proxy_pass http://hubium_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # uploads go to the app as they arrive; live updates and the AI tutor's answers are
        # streams the app asks not to buffer (X-Accel-Buffering), open for long
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
