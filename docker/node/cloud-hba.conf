# Access to the cloud's database once local nodes replicate it (docker/node/cloud-db.sh):
# the nodes' roles (members of hubium_nodes) may replicate over TLS and nothing else; the
# app keeps its access as the PostgreSQL image sets it up.
local     all          all                           trust
host      all          all            127.0.0.1/32   trust
host      all          all            ::1/128        trust
hostssl   replication  +hubium_nodes  all            scram-sha-256
host      all          +hubium_nodes  all            reject
host      replication  all            all            reject
host      all          all            all            scram-sha-256
