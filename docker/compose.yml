# Hubium LMS in Docker. Start from .env.production.example (install-hubium.sh writes it):
#   docker compose -f docker/compose.yml --env-file .env pull     # a published release
#   docker compose -f docker/compose.yml --env-file .env up -d
# From a source checkout, build the images instead: `up -d --build` (prefix it with
# BUILD_COMMIT=$(git rev-parse HEAD) to show the commit in the app).
#
# Optional services are profiles, chosen with COMPOSE_PROFILES in .env:
#   db       PostgreSQL with pgvector (without it, set DATABASE_URL to your server)
#   s3       S3-compatible storage (RustFS) for STORAGE_DRIVER=s3 (or point S3_* elsewhere)
#   caddy    HTTPS for APP_URL, CONTENT_HOST and S3_PUBLIC_URL (without it, proxy
#            127.0.0.1:3000 yourself)
#   media    the video transcoding worker (needed by the video activity)
#   mailpit  catches mail until SMTP_URL points at a real server
#   clamav   scans uploads for malware (set CLAMAV_URL=tcp://clamav:3310); needs ~3 GB RAM
#   ai-local Ollama with the bge-m3 embedding model for the AI tutor's search (set
#            AI_EMBEDDINGS_URL=http://ollama:11434/v1, AI_EMBEDDINGS_MODEL=bge-m3 and
#            SSRF_ALLOW_HOSTS=ollama); ~2 GB RAM and a 1.2 GB download
name: hubium
x-build: &build
  context: ..
  dockerfile: docker/Dockerfile
  args:
    BUILD_COMMIT: ${BUILD_COMMIT:-}
x-image: &image ${HUBIUM_IMAGE:-ghcr.io/sharapov-outsource/hubium-lms}:${HUBIUM_VERSION:-latest}
x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://hubium:${POSTGRES_PASSWORD:-hubium}@db:5432/hubium}
  APP_URL: ${APP_URL:-https://lms.localhost}
  CONTENT_HOST: ${CONTENT_HOST:-https://content.localhost}
  APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:9000}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://files.localhost}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-hubium}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-hubium}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  MAIL_FROM: ${MAIL_FROM:-Hubium LMS <no-reply@hubium.local>}
  BBB_URL: ${BBB_URL:-}
  BBB_SECRET: ${BBB_SECRET:-}
  JITSI_DOMAIN: ${JITSI_DOMAIN:-}
  JITSI_APP_ID: ${JITSI_APP_ID:-}
  JITSI_APP_SECRET: ${JITSI_APP_SECRET:-}
  AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
  AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
  AUTH_YANDEX_ID: ${AUTH_YANDEX_ID:-}
  AUTH_YANDEX_SECRET: ${AUTH_YANDEX_SECRET:-}
  AUTH_VK_ID: ${AUTH_VK_ID:-}
  AUTH_VK_SECRET: ${AUTH_VK_SECRET:-}
  # Web Push, the Prometheus endpoint, the REST API limit and internal hosts the server may
  # call (a local Ollama, an LTI tool on the LAN); see docs/operations.md
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  API_RATE_LIMIT_PER_MIN: ${API_RATE_LIMIT_PER_MIN:-120}
  SSRF_ALLOW_HOSTS: ${SSRF_ALLOW_HOSTS:-}
  # Virus scanning of uploads with the clamav profile (or any clamd); see docs/operations.md
  CLAMAV_URL: ${CLAMAV_URL:-}
  CLAMAV_MAX_SCAN_MB: ${CLAMAV_MAX_SCAN_MB:-100}
  CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-20000}
  # The embedding endpoint the first start configures (the ai-local profile, or your own);
  # Administration → AI changes it later
  AI_EMBEDDINGS_URL: ${AI_EMBEDDINGS_URL:-}
  AI_EMBEDDINGS_MODEL: ${AI_EMBEDDINGS_MODEL:-}
  AI_EMBEDDINGS_API_KEY: ${AI_EMBEDDINGS_API_KEY:-}
  # JSON log lines on stdout (docker compose logs); see docs/operations.md
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Traces over OTLP/HTTP to your collector (Jaeger, Tempo…); off while the endpoint is empty
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
x-after-migrate: &after-migrate
  migrate: { condition: service_completed_successfully }
  clamav: { condition: service_healthy, required: false }

services:
  db:
    profiles: [db]
    # Keep the Debian release of an existing cluster: a different glibc changes collations.
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_USER: hubium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hubium}
      POSTGRES_DB: hubium
    volumes: [db:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubium"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # S3-compatible object storage. Browsers reach it only through presigned URLs on
  # S3_PUBLIC_URL (see Caddyfile); any other S3 service works through the S3_* settings.
  s3:
    profiles: [s3]
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-hubium}
      # Required with this profile. Compose reads every service, so instead of failing for
      # all, the storage stays unhealthy without it and nothing that depends on it starts.
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes: [s3:/data]
    healthcheck:
      test: ["CMD-SHELL", "[ -n \"$$RUSTFS_SECRET_KEY\" ] && curl -fsS http://localhost:9000/health"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # Catches outgoing mail until SMTP_URL points at a real server. The UI listens on the
  # host's loopback only: http://127.0.0.1:8025 (it shows password-reset links).
  mailpit:
    profiles: [mailpit]
    image: axllent/mailpit:v1.31
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped

  # Scans uploads before they are stored. While CLAMAV_URL is set and clamd is down, uploads
  # are refused. The signatures ship in the image and freshclam keeps them up to date.
  clamav:
    profiles: [clamav]
    image: clamav/clamav:1.5.4-debian13-slim
    environment:
      # a little above CLAMAV_MAX_SCAN_MB: larger files are stored without a scan
      CLAMD_CONF_StreamMaxLength: 110M
      CLAMD_CONF_MaxFileSize: 110M
    volumes: [clamav:/var/lib/clamav]
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 10s
      retries: 6
      start_period: 6m
    deploy:
      resources:
        # the signatures take ~1 GB, twice that while freshclam reloads them
        limits: { memory: 3g }
    restart: unless-stopped

  # Embeddings for the AI tutor's search on this machine (CPU is enough for bge-m3).
  ollama:
    profiles: [ai-local]
    image: ollama/ollama:0.40.3
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30
    deploy:
      resources:
        limits: { memory: 3g }
    restart: unless-stopped

  # Downloads the model once (later starts find it in the volume and finish at once).
  ollama-pull:
    profiles: [ai-local]
    image: ollama/ollama:0.40.3
    entrypoint: ["ollama", "pull", "bge-m3"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama: { condition: service_healthy }
    restart: "no"

  # Migrations, the S3 bucket and the idempotent seed, before every start.
  migrate:
    image: *image
    command: ["migrate", "--seed", "${SEED_PROFILE:-minimal}"]
    environment:
      <<: *app-env
      HUBIUM_SERVICE: migrate
      # read only while the administrator does not exist yet
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@hubium.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    healthcheck: { disable: true }
    depends_on:
      db: { condition: service_healthy, required: false }
      s3: { condition: service_healthy, required: false }
      ollama-pull: { condition: service_completed_successfully, required: false }

  # Its build section makes the image migrate and worker use too.
  web:
    image: *image
    build: { <<: *build, target: hubium }
    environment:
      <<: *app-env
      HUBIUM_SERVICE: web
    # For a reverse proxy of your own instead of the caddy profile.
    ports: ["${HUBIUM_WEB_BIND:-127.0.0.1:3000}:3000"]
    # Unfinished uploads (and with STORAGE_DRIVER=fs the files) are written here; the
    # worker's cron removes abandoned uploads.
    volumes: [data:/data]
    depends_on: *after-migrate
    restart: unless-stopped

  worker:
    image: *image
    command: ["worker"]
    environment:
      <<: *app-env
      HUBIUM_SERVICE: worker
      WORKER_QUEUES: default
    volumes: [data:/data]
    depends_on: *after-migrate
    restart: unless-stopped

  worker-media:
    profiles: [media]
    image: ${HUBIUM_IMAGE:-ghcr.io/sharapov-outsource/hubium-lms}-media:${HUBIUM_VERSION:-latest}
    build: { <<: *build, target: hubium-media }
    environment:
      <<: *app-env
      HUBIUM_SERVICE: worker-media
      WORKER_QUEUES: media
    volumes: [data:/data]
    depends_on: *after-migrate
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
    restart: unless-stopped

  caddy:
    profiles: [caddy]
    image: caddy:2.11
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    environment:
      APP_URL: ${APP_URL:-https://lms.localhost}
      CONTENT_HOST: ${CONTENT_HOST:-https://content.localhost}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://files.localhost}
    depends_on:
      web: { condition: service_started }
      s3: { condition: service_healthy, required: false }
    restart: unless-stopped

volumes:
  db:
  s3:
  clamav:
  ollama:
  # local files of web and the workers (see the Dockerfile)
  data:
  caddy:
