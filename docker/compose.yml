# Production-like stack: `docker compose -f docker/compose.yml --env-file .env up -d --build`
name: hubium
x-app-env: &app-env
  DATABASE_URL: postgresql://hubium:${POSTGRES_PASSWORD:-hubium}@db:5432/hubium
  APP_URL: ${APP_URL:-https://lms.localhost}
  APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://files.localhost}
  S3_BUCKET: hubium
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-hubium}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-hubium-secret}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  MAIL_FROM: ${MAIL_FROM:-Hubium <no-reply@hubium.local>}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@hubium.local}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin12345!}
  AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
  AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
  AUTH_YANDEX_ID: ${AUTH_YANDEX_ID:-}
  AUTH_YANDEX_SECRET: ${AUTH_YANDEX_SECRET:-}
  AUTH_VK_ID: ${AUTH_VK_ID:-}
  AUTH_VK_SECRET: ${AUTH_VK_SECRET:-}

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: hubium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hubium}
      POSTGRES_DB: hubium
    volumes: [db:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubium"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hubium}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hubium-secret}
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-hubium} $${MINIO_ROOT_PASSWORD:-hubium-secret}
      && mc mb --ignore-existing local/hubium && mc anonymous set none local/hubium"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hubium}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hubium-secret}

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]
    restart: unless-stopped

  migrate:
    build: { context: .., dockerfile: docker/Dockerfile, target: migrate }
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: .., dockerfile: docker/Dockerfile, target: web }
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: docker/Dockerfile, target: worker }
    environment:
      <<: *app-env
      WORKER_QUEUES: default
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker-media:
    build: { context: .., dockerfile: docker/Dockerfile, target: worker-media }
    environment:
      <<: *app-env
      WORKER_QUEUES: media
      WORKER_HEALTH_PORT: "3001"
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    environment:
      LMS_HOST: ${LMS_HOST:-lms.localhost}
      CONTENT_HOST: ${CONTENT_HOST:-content.localhost}
      FILES_HOST: ${FILES_HOST:-files.localhost}
    depends_on: [web]
    restart: unless-stopped

volumes:
  db:
  minio:
  caddy:
