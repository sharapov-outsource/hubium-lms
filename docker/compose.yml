# Production stack: `docker compose -f docker/compose.yml --env-file .env up -d --build`
# (prefix it with `BUILD_COMMIT=$(git rev-parse HEAD)` to show the commit in the app).
# Start from .env.production.example. The three public URLs below are used by the app and
# by Caddy alike; the defaults (*.localhost) work for a trial run on one machine.
name: hubium
# The same arguments for every image, so they share one build stage.
x-build-args: &build-args
  BUILD_COMMIT: ${BUILD_COMMIT:-}
x-app-env: &app-env
  DATABASE_URL: postgresql://hubium:${POSTGRES_PASSWORD:-hubium}@db:5432/hubium
  APP_URL: ${APP_URL:-https://lms.localhost}
  CONTENT_HOST: ${CONTENT_HOST:-https://content.localhost}
  APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://s3:9000
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://files.localhost}
  S3_BUCKET: hubium
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-hubium}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  MAIL_FROM: ${MAIL_FROM:-Hubium LMS <no-reply@hubium.local>}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@hubium.local}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin12345!}
  AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
  AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
  AUTH_YANDEX_ID: ${AUTH_YANDEX_ID:-}
  AUTH_YANDEX_SECRET: ${AUTH_YANDEX_SECRET:-}
  AUTH_VK_ID: ${AUTH_VK_ID:-}
  AUTH_VK_SECRET: ${AUTH_VK_SECRET:-}
  # JSON log lines on stdout (docker compose logs); see docs/operations.md
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  db:
    # Keep the Debian release of an existing cluster: a different glibc changes collations.
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_USER: hubium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hubium}
      POSTGRES_DB: hubium
    volumes: [db:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubium"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # S3-compatible object storage. Browsers reach it only through presigned URLs on
  # S3_PUBLIC_URL (see Caddyfile); any other S3 service works through the S3_* settings.
  s3:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-hubium}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes: [s3:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # Catches outgoing mail until SMTP_URL points at a real server. The UI listens on the
  # host's loopback only: http://127.0.0.1:8025 (it shows password-reset links).
  mailpit:
    image: axllent/mailpit:v1.31
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped

  migrate:
    build: { context: .., dockerfile: docker/Dockerfile, target: migrate, args: *build-args }
    environment:
      <<: *app-env
      HUBIUM_SERVICE: migrate
      # minimal: the administrator only; demo: also sample courses and users
      SEED_PROFILE: ${SEED_PROFILE:-minimal}
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_healthy }

  web:
    build: { context: .., dockerfile: docker/Dockerfile, target: web, args: *build-args }
    environment:
      <<: *app-env
      HUBIUM_SERVICE: web
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: docker/Dockerfile, target: worker, args: *build-args }
    environment:
      <<: *app-env
      HUBIUM_SERVICE: worker
      WORKER_QUEUES: default
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker-media:
    build: { context: .., dockerfile: docker/Dockerfile, target: worker-media, args: *build-args }
    environment:
      <<: *app-env
      HUBIUM_SERVICE: worker-media
      WORKER_QUEUES: media
      WORKER_HEALTH_PORT: "3001"
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
    restart: unless-stopped

  caddy:
    image: caddy:2.11
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    environment:
      APP_URL: ${APP_URL:-https://lms.localhost}
      CONTENT_HOST: ${CONTENT_HOST:-https://content.localhost}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://files.localhost}
    depends_on: [web, s3]
    restart: unless-stopped

volumes:
  db:
  s3:
  caddy:
