# Infrastructure for local development: `docker compose -f docker/compose.dev.yml up -d`
name: hubium-dev
services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: hubium
      POSTGRES_PASSWORD: hubium
      POSTGRES_DB: hubium
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubium"]
      interval: 5s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: hubium
      MINIO_ROOT_PASSWORD: hubium-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
volumes:
  db:
  minio:
