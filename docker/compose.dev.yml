# Infrastructure for local development: `docker compose -f docker/compose.dev.yml up -d`
name: hubium-dev
services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_USER: hubium
      POSTGRES_PASSWORD: hubium
      POSTGRES_DB: hubium
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubium"]
      interval: 5s
      retries: 20
  # S3-compatible storage for trying STORAGE_DRIVER=s3 locally (the default is the local FS).
  # Console: http://localhost:9001
  s3:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: hubium
      RUSTFS_SECRET_KEY: hubium-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.31
    ports: ["1025:1025", "8025:8025"]
  # Identity provider for trying single sign-on (OIDC, SAML) and the e2e scenarios:
  # `docker compose -f docker/compose.dev.yml --profile sso up -d`, admin / admin at
  # http://127.0.0.1:8080, realm "hubium" (users kira and nikita, password Kc-pass-123).
  keycloak:
    image: keycloak/keycloak:26.4.2
    profiles: [sso]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes: [../e2e/keycloak:/opt/keycloak/data/import:ro]
volumes:
  db:
  s3:
